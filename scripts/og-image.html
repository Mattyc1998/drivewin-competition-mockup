<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #05070f;
  }

  .canvas img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(5,7,15,0.97) 0%, rgba(5,7,15,0.88) 32%, rgba(5,7,15,0.35) 62%, rgba(5,7,15,0.15) 100%),
      linear-gradient(0deg, rgba(5,7,15,0.55) 0%, rgba(5,7,15,0.05) 40%);
  }

  .logo {
    position: absolute;
    top: 56px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo .mark {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, #f0cf72, #b8912a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 30px;
    color: #05070f;
  }

  .logo .word {
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.5px;
    color: #ffffff;
  }
  .logo .word span {
    color: #f0cf72;
  }

  .headline {
    position: absolute;
    left: 64px;
    top: 260px;
    width: 760px;
  }

  .headline p {
    font-weight: 900;
    font-size: 64px;
    line-height: 1.08;
    letter-spacing: -1.5px;
    color: #ffffff;
    text-wrap: balance;
  }

  .headline p.gold {
    color: #f0cf72;
  }

  .subtext {
    position: absolute;
    left: 64px;
    top: 512px;
    width: 640px;
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
    line-height: 1.4;
  }

  .badge {
    position: absolute;
    top: 56px;
    right: 64px;
    background: rgba(5,7,15,0.8);
    border: 1px solid rgba(240,207,114,0.5);
    color: #f0cf72;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 20px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="https://images.unsplash.com/photo-1638686302275-0e87df720aca?auto=format&fit=crop&crop=entropy&w=1200&h=630&q=80" />
    <div class="overlay"></div>

    <div class="logo">
      <div class="mark">D</div>
      <div class="word">Drive<span>Win</span></div>
    </div>

    <span class="badge">18+ · UK Prize Draws</span>

    <div class="headline">
      <p>Some people buy cars.</p>
      <p class="gold">Others win them.</p>
    </div>

    <div class="subtext">
      Enter live prize draws for premium cars &amp; bikes — instant ticket numbers, real winners, every draw filmed live.
    </div>
  </div>
</body>
</html>
